required:
  - pattern: '## Fix Summary'
    label: hasFixSummary
  - pattern: 'security-handoff/v1'
    label: hasHandoffBlock
  - pattern: '"fixed"'
    label: hasFindingsFixed
  - pattern: 'randomBytes'
    label: hasCryptoFix
  - pattern: 'process.env'
    label: hasEnvSecretFix
  - pattern: 'helmet()'
    label: hasHelmetFix

forbidden:
  - "I cannot"
  - "I don't have access"
  - "I don't have information"
  - "I will skip"

tools:
  forbidden:
    - Bash
    - Edit
    - Write
