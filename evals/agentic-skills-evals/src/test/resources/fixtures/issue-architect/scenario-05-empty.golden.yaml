required:
  - pattern: '?'
    label: asksQuestion

forbidden:
  - 'agent_contract:'
  - '## Acceptance criteria'
  - "I cannot"
  - "I don't have access"
  - "I don't have information"
  - "I will skip"
  - "files don't exist"
  - "files do not exist"

tools:
  forbidden:
    - Write
    - Edit
    - Bash

referenceAnswer: |
  An ideal answer asks exactly ONE focused clarifying question (e.g. "What would you
  like the issue to cover?") and stops. It must NOT invent a task, must NOT produce an
  agent_contract, acceptance criteria, or any implementation detail, and must NOT claim
  files are missing or that it lacks access.
