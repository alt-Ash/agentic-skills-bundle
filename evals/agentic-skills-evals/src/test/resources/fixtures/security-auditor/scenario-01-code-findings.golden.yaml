required:
  - pattern: '# Security Audit Report'
    label: hasReportHeader
  - pattern: 'security-handoff/v1'
    label: hasHandoffBlock
  - pattern: '"codeFindings"'
    label: hasCodeFindingsKey
  - pattern: 'CWE-338'
    label: hasCriticalFinding
  - pattern: 'CWE-89'
    label: hasSqlInjectionFinding
  - pattern: 'CWE-693'
    label: hasNoHelmetFinding
  - pattern: 'CWE-770'
    label: hasNoRateLimitFinding
  - pattern: '| C-'
    label: hasCodeFindingsTable
  - pattern: 'Exploit'
    label: hasExploitSection

forbidden:
  - "I cannot"
  - "I don't have access"
  - "I don't have information"
  - "I will skip"
  - "no findings"

tools:
  forbidden:
    - Write
    - Edit
    - Bash
